<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080810">
<title>Pajin VIP · Las Vegas + LA · Oktobar 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
 --bg:#080810; --surface:#10101b; --surface2:#171725; --border:#242438;
 --text:#ede9e3; --muted:#77738b; --accent:#c8a96e; --danger:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
#ambient{position:fixed;inset:0;pointer-events:none;z-index:0;transition:background .7s ease}
.header{position:relative;z-index:2;padding:42px 20px 0;text-align:center}
.header-eyebrow{font-size:10px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.header-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:400;line-height:1}
.header-title em{font-style:italic;color:var(--accent)}
.header-sub{font-size:10px;color:#555267;margin-top:9px;letter-spacing:1px}
.header-line{width:38px;height:1px;background:var(--accent);margin:16px auto 0}
.tabs-wrap{position:relative;z-index:2;padding:23px 14px 0;overflow-x:auto;display:flex;gap:7px;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;width:69px;padding:9px 5px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;text-align:center;transition:.25s}
.tab.active{border-color:var(--day-color);background:color-mix(in srgb,var(--day-color) 12%,var(--surface));color:var(--day-color)}
.tab-emoji{font-size:19px;display:block;margin-bottom:3px}
.tab-num{font-size:9px;display:block}
.tab-date{font-size:8px;display:block;opacity:.7;margin-top:2px}
.day-card{position:relative;z-index:2;margin:15px 15px 0;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:19px}
.day-card-top{display:flex;justify-content:space-between;align-items:flex-start}
.day-label-sm{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.day-title{font-family:'Playfair Display',serif;font-size:23px;font-weight:400;margin-bottom:5px}
.day-subtitle{font-size:10px;color:var(--muted);line-height:1.5;max-width:290px}
.day-right{text-align:right;flex-shrink:0;margin-left:10px}
.day-badge{font-size:10px;padding:4px 9px;border-radius:20px;white-space:nowrap}
.day-rating{font-size:10px;color:var(--accent);margin-top:7px;white-space:nowrap}
.day-duration{font-size:8px;color:#555;margin-top:4px;white-space:nowrap}
.day-tip{margin-top:14px;padding:10px 11px;background:#0a0a12;border-radius:10px;border-left:2px solid var(--accent);font-size:10.5px;color:#999;line-height:1.6}
.stops-list{position:relative;z-index:2;padding:15px 15px 70px}
.stop-row{display:flex;gap:9px}
.stop-timeline{display:flex;flex-direction:column;align-items:center;width:34px;flex-shrink:0}
.stop-dot{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;z-index:1}
.stop-line{width:1px;flex:1;min-height:15px;background:var(--border)}
.stop-content{flex:1;padding-bottom:9px}
.stop-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 13px;cursor:pointer;width:100%;text-align:left;color:var(--text);transition:.2s}
.stop-card:active{transform:scale(.985)}
.stop-card.open{background:var(--surface2);border-color:color-mix(in srgb,var(--day-color) 35%,var(--border))}
.stop-top{display:flex;justify-content:space-between;align-items:center}
.stop-time{font-size:9px;color:var(--muted);letter-spacing:.5px;margin-bottom:3px}
.stop-name{font-family:'Playfair Display',serif;font-size:14px;line-height:1.3}
.stop-addr{font-size:9px;color:#4f4c5d;margin-top:3px}
.stop-chevron{font-size:8px;color:#444;transition:.2s;margin-left:8px}
.stop-card.open .stop-chevron{transform:rotate(180deg);color:var(--day-color)}
.stop-warning{margin-top:8px;padding:5px 7px;background:#1b1405;border-radius:7px;font-size:9px;color:#d97706;display:flex;gap:5px;align-items:center}
.stop-note{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:#999;line-height:1.7;display:none}
.stop-card.open .stop-note{display:block}
.footer{position:relative;z-index:2;text-align:center;padding:0 15px 35px;font-size:8px;color:#2b2938;letter-spacing:1.7px;text-transform:uppercase}
@media(min-width:700px){
 body{max-width:620px;margin:auto;border-left:1px solid #11111d;border-right:1px solid #11111d}
 .header{padding-top:52px}
}
</style>
</head>

 document.getElementById('dayRating').textContent='★★★★★ '+d.rating;
 document.getElementById('dayDuration').textContent=d.duration;
 document.getElementById('dayTip').textContent='💡 '+d.tip;
 document.getElementById('dayCard').style.borderColor=hexToRgba(d.color,.3);
 document.querySelector('.day-label-sm').style.color=d.color;
 const b=document.getElementById('dayBadge'); b.style.background=hexToRgba(d.color,.15); b.style.color=d.color;
 document.getElementById('dayRating').style.color=d.color;
 document.querySelector('.day-tip').style.borderLeftColor=d.color;
 document.getElementById('hline').style.background=d.color;
 document.getElementById('ambient').style.background=`radial-gradient(ellipse at 50% 0%, ${hexToRgba(d.color,.09)} 0%, transparent 65%)`;
}
function renderStops(){
 const d=days[activeDay], list=document.getElementById('stopsList');
 list.style.setProperty('--day-color',d.color);
 list.innerHTML=d.stops.map((s,i)=>{
 const last=i===d.stops.length-1;
 return `<div class="stop-row">
  <div class="stop-timeline"><div class="stop-dot">${s.icon}</div>${!last?'<div class="stop-line"></div>':''}</div>
  <div class="stop-content">
  <button class="stop-card" id="stop-${i}" onclick="toggleStop(${i})">
   <div class="stop-top"><div style="flex:1">
   <div class="stop-time">${s.time}</div><div class="stop-name">${s.name}</div>
   </div><div class="stop-chevron">▼</div></div>
   ${s.warn?`<div class="stop-warning">⚠️ ${s.warn}</div>`:''}
   <div class="stop-note">${s.note}</div>
  </button>
  </div>
 </div>`;
 }).join('');
}
function toggleStop(i){
 const card=document.getElementById('stop-'+i);
 if(openStop===i){card.classList.remove('open');openStop=null;return;}
 if(openStop!==null){const p=document.getElementById('stop-'+openStop);if(p)p.classList.remove('open');}
 card.classList.add('open');openStop=i;
 setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}
function selectDay(i){
 activeDay=i;openStop=null;renderTabs();renderDay();renderStops();window.scrollTo({top:0,behavior:'smooth'});
}
renderTabs();renderDay();renderStops();
</script>
